name: Publish Squid Proxy to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          docker build --pull \
            --platform linux/amd64 \
            --tag "${DOCKERHUB_USERNAME}/squid:${GITHUB_SHA}" \
            --tag "${DOCKERHUB_USERNAME}/squid:latest" \
            .

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail

          docker push "${DOCKERHUB_USERNAME}/squid:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/squid:latest"
