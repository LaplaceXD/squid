name: Publish Squid Proxy to Azure China

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          docker build --pull \
            --platform linux/amd64 \
            --tag "${ACR_LOGIN_SERVER}/squid-proxy:${GITHUB_SHA}" \
            --tag "${ACR_LOGIN_SERVER}/squid-proxy:latest" \
            .

      - name: Log in to Azure China registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail

          docker push "${ACR_LOGIN_SERVER}/squid-proxy:${GITHUB_SHA}"
          docker push "${ACR_LOGIN_SERVER}/squid-proxy:latest"
